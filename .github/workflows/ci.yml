name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check backend

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run backend tests
        env:
          PYTHONPATH: backend
          VF_DATABASE_URL: "sqlite:///./runtime_data/test.db"
          VF_SECRET_KEY: "ci-test-secret-not-for-prod"
        run: |
          python -m app.seed || true
          python -m pytest backend/tests -q

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          cd backend
          pip install -r requirements.txt
          pip install httpx
      - name: Run E2E smoke
        env:
          PYTHONPATH: backend
          VF_DATABASE_URL: "sqlite:///./runtime_data/e2e.db"
          VF_SECRET_KEY: "ci-e2e-secret-not-for-prod"
        run: |
          python -m app.seed || true
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8799 &
          sleep 6
          python scripts/e2e_smoke.py http://127.0.0.1:8799
